name: fitstart
description: "FitPulse – Home Workout & Fitness Tracker for Beginners"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State management & Preferences
  provider: ^6.1.2
  shared_preferences: ^2.2.3

  # Firebase
  firebase_core: ^3.1.0
  firebase_auth: ^5.1.0
  cloud_firestore: ^5.0.1
  google_sign_in: 6.2.1

  # Supabase & Media
  supabase_flutter: ^2.18.0
  image_picker: ^1.0.7
  file_picker: ^8.0.0
  cached_network_image: ^3.4.1

  # Utilities & Sharing
  share_plus: ^10.0.0
  path_provider: ^2.1.2
  flutter_local_notifications: ^17.0.0
  timezone: ^0.9.2
  flutter_timezone: ^3.0.1
  flutter_native_splash: ^2.4.4

  # Charts & UI & Media
  fl_chart: ^0.68.0
  lottie: ^3.1.2
  video_player: ^2.8.6
  cupertino_icons: ^1.0.8
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter_native_splash:
  color: "#082721"
  image: assets/icons/app_icon.png
  android_12:
    image: assets/icons/app_icon.png
    icon_background_color: "#082721"
    color: "#082721"

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
