name: fitstart
description: "FitStart – Home Workout & Fitness Tracker for Beginners"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State management
  provider: ^6.1.2
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Routing
  go_router: ^14.2.0

  # Firebase
  firebase_core: ^3.1.0
  firebase_auth: ^5.1.0
  cloud_firestore: ^5.0.1
  firebase_storage: ^12.0.1
  firebase_messaging: ^15.0.1
  firebase_analytics: ^11.0.1
  firebase_crashlytics: ^4.0.1
  google_sign_in: ^6.2.1
  sign_in_with_apple: ^6.1.1

  # Local storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # Networking
  dio: ^5.4.3

  # Charts & UI & Media
  fl_chart: ^0.68.0
  lottie: ^3.1.2
  google_fonts: ^6.2.1
  video_player: ^2.8.6

  # DI
  get_it: ^7.7.0

  # Utilities
  dartz: ^0.10.1
  equatable: ^2.0.5
  intl: ^0.19.0
  flutter_local_notifications: ^17.2.1
  cupertino_icons: ^1.0.8
  google_generative_ai: ^0.4.4
  supabase_flutter: ^2.18.0
  image_picker: ^1.0.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.11
  hive_generator: ^2.0.1
  mocktail: ^1.0.4
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/images/app_icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/images/app_icon.png"

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/animations/
    - assets/icons/
